# Publishes a tagged version to Maven Central and drafts the GitHub release.
#
# Who can release: pushing a v* tag only starts the run. The publish job runs in the
# `release` environment, which requires the owner's approval and is the only place the
# Central Portal credentials and the signing key live, so neither a collaborator's tag
# nor a fork can reach them. Tag creation is additionally restricted by a repository
# ruleset that lets only the owner create v* tags.
#
# The tag must match the version in build.gradle.kts; a mismatch fails before anything
# is built, which is the mistake the 0.1.0 release hit by hand.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'inemtsev/klokka'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Check the tag matches the build version
        run: |
          version=$(./gradlew -q :properties --property version | sed -n 's/^version: //p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build version $version"
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT) echo "::error::Refusing to release a SNAPSHOT version"; exit 1 ;;
          esac

      - name: Build (compile + tests + ktlint + detekt + apiCheck)
        run: ./gradlew build

      - name: Publish and release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Klokka ${GITHUB_REF_NAME#v}" --generate-notes
